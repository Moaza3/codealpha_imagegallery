<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Gallery</h1>
        <p>created by Moaza</p>
    </header>

    <div class="gallery" id="gallery"></div>

    <div class="lightbox" id="lightbox">
        <button class="close" id="closeBtn">&times;</button>
        <button class="arrow prev" id="prevBtn">&#10094;</button>
        <img src="" alt="" id="lightboxImg">
        <button class="arrow next" id="nextBtn">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
